name: Publish

# A pushed `v<version>` tag publishes that version through npm trusted publishing, which this file's name is registered for.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  checks:
    uses: ./.github/workflows/ci.yml

  publish:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - name: The tag names package.json's version
        run: test "$GITHUB_REF_NAME" = "v$(node -p 'require("./package.json").version')"
      - run: npm publish --provenance
